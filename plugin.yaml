name: caveman
title: Caveman (token-compressed replies)
description: >
  Squeezes the assistant's own wording down while keeping full technical
  accuracy. Prompt-based; supports 6 intensity levels:
  lite, full, ultra, wenyan-lite, wenyan-full, wenyan-ultra.

  Derived from Julius Brussee's caveman plugin
  (https://github.com/juliusbrussee/caveman), adapted to Agent Zero
  conventions. MIT licensed.
version: 0.5.1
settings_sections:
  - developer
per_project_config: false
per_agent_config: false
always_enabled: false
