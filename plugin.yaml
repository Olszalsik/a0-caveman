name: caveman
title: Caveman + Headroom — Lean Context
description: >
  Combines Caveman response-style controls with optional Headroom context
  compression. Tune concise replies, compress eligible logs and history,
  protect source reads, and retrieve stored originals through CCR. Compression
  and style controls are independent; token savings depend on workload.

  Derived from Julius Brussee's caveman plugin
  (https://github.com/juliusbrussee/caveman), adapted to Agent Zero
  conventions. MIT licensed.
version: 0.5.4
settings_sections:
  - developer
per_project_config: true
per_agent_config: true
always_enabled: false
